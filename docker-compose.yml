services:
  taiga-front:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_EVENTS_URL: ${VITE_EVENTS_URL:-wss://planning.company.mx/events}
        VITE_DEFAULT_APP_TITLE: ${VITE_DEFAULT_APP_TITLE:-planning}
        VITE_DEFAULT_COMPANY_NAME: ${VITE_DEFAULT_COMPANY_NAME:-""}
    container_name: taiga-modern-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
